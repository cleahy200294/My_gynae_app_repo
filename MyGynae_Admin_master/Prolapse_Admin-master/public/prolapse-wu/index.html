<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Unity WebGL Player | Prolapse Animation</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #unity-canvas { width: 100%; height: 100%; background: #231F20; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="400" height="400"></canvas>
  <script src="build/prolapse-wu.loader.js"></script>
  <script>
    // Check if this is a screenshot request
    const urlParams = new URLSearchParams(window.location.search);
    const isShot = urlParams.get('shot') === 'true';

    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "build/prolapse-wu.data",
      frameworkUrl: "build/prolapse-wu.framework.js",
      codeUrl: "build/prolapse-wu.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "prolapse-wu",
      productVersion: "1.0",
      webglContextAttributes: { preserveDrawingBuffer: true },
    }).then(function(unityInstance) {
      // If shot mode, capture canvas after Unity loads and sends to parent
      if (isShot && window.parent !== window) {
        // Wait for Unity to render, then capture
        setTimeout(function() {
          try {
            var canvas = document.querySelector("#unity-canvas");
            var imageData = canvas.toDataURL("image/png").split(',')[1];
            // Send as 'current' for the first capture
            window.parent.postMessage(imageData + '|==|current', '*');
            // Also try sending as 'pre' after a short delay
            setTimeout(function() {
              var imageData2 = canvas.toDataURL("image/png").split(',')[1];
              window.parent.postMessage(imageData2 + '|==|pre', '*');
            }, 500);
          } catch(e) {
            console.error('Failed to capture canvas:', e);
          }
        }, 3000); // Wait 3 seconds for Unity to fully load
      }
    });
  </script>
</body>
</html>
